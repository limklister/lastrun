<style>
/* Layout: full-bleed raymarched scene; start panel sits low and left, scene stays visible behind it. */
:root {
  --dusk: #15102b;
  --ink: #fbeee3;
  --ink-dim: #d6c0cb;
  --ember: #ff8f4f;
  --glow: #ffd0a0;
  --glass: rgba(21, 16, 43, 0.58);
  --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--dusk);
  color: var(--ink);
  font-family: var(--font-display);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.menu {
  position: fixed; inset: 0;
  display: flex; align-items: flex-end;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: opacity 0.9s ease;
}
.menu.hidden { opacity: 0; pointer-events: none; }
.scrim {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to top right, rgba(21,16,43,0.82) 0%, rgba(21,16,43,0.45) 38%, rgba(21,16,43,0) 70%);
}
.panel {
  position: relative; min-width: 0;
  width: min(30rem, 100%);
  padding: 0 0 max(0px, env(safe-area-inset-bottom, 0px)) clamp(0px, 3vw, 40px);
  display: flex; flex-direction: column; gap: 14px;
}
.eyebrow {
  margin: 0; font-family: var(--font-mono); font-size: 0.75rem;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--glow);
}
h1 {
  margin: 0; font-weight: 700; font-size: clamp(2.6rem, 9vw, 4.6rem);
  line-height: 0.96; letter-spacing: -0.025em; text-wrap: balance;
}
.lede { margin: 0; max-width: 26rem; color: var(--ink-dim); font-size: 1.05rem; line-height: 1.45; }
.keys {
  margin: 6px 0 0; display: grid; grid-template-columns: max-content 1fr;
  gap: 10px 18px; align-items: center; font-size: 0.98rem;
}
.keys dt { color: var(--ink-dim); }
.keys dd { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
kbd {
  font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink);
  background: var(--glass); border: 1px solid rgba(255,208,160,0.35);
  border-bottom-width: 2px; border-radius: 5px; padding: 2px 8px; min-width: 1.4em; text-align: center;
}
.or { color: var(--ink-dim); font-size: 0.85rem; }
button#go {
  align-self: flex-start; margin-top: 8px;
  font: 700 1.05rem var(--font-display); letter-spacing: 0.01em;
  color: #2a1204; background: var(--ember);
  border: 0; border-radius: 999px; padding: 13px 28px; cursor: pointer;
  box-shadow: 0 6px 26px rgba(255,143,79,0.35);
  transition: transform 0.15s ease, background 0.15s ease;
}
button#go:disabled { opacity: 0.55; cursor: progress; transform: none; }
button#go:hover:not(:disabled) { background: #ffa56f; transform: translateY(-1px); }
button#go:focus-visible { outline: 3px solid var(--glow); outline-offset: 3px; }
.fine { margin: 2px 0 0; font-size: 0.8rem; color: var(--ink-dim); opacity: 0.8; }
#fail {
  position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
  background: var(--dusk); color: var(--ink); text-align: center; font-size: 1.1rem; line-height: 1.5;
}
#fail[hidden], .menu[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { .menu, button#go { transition: none; } }
#splash { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  background: linear-gradient(to bottom, #1b1537 0%, #5b3a66 55%, #e58a5f 100%); color: #fff4e8; transition: opacity .6s ease; font-family: inherit; }
#splash.done { opacity: 0; pointer-events: none; }
#splash h2 { margin: 0; font-size: clamp(2rem, 8vw, 3.6rem); font-weight: 700; letter-spacing: 0.04em; }
#splash .bar { width: min(18rem, 60vw); height: 4px; border-radius: 2px; background: rgba(255,244,232,0.2); overflow: hidden; }
#splash .bar i { display: block; height: 100%; width: 4%; background: #ffb078; border-radius: 2px; transition: width .35s ease-out; }

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform vec2 uJit;      // sub-pixel jitter for temporal anti-aliasing
uniform float uTaa;     // 1 when the temporal resolve pass is used
uniform float uTime;
uniform vec4 uDbg;    // profiling switches: shadows, occlusion, trees, spray (1 = on)
uniform vec4 uDbg2;   // ground detail (tracks, ripples, spindrift)
uniform vec3 uCamPos, uCamR, uCamU, uCamF;
uniform float uFocal;
uniform vec3 uRPos, uRX, uRY, uRZ;
uniform float uCrouch, uSteer, uAir, uSpeed;
uniform float uRzB;   // world z of the local origin, modulo 65536 (landscape character repeats only that far)
uniform float uRz;   // world z of the local origin, modulo 16384 m (the hill repeats only that far)
uniform vec4 uTrail[48];
uniform vec4 uSpray[72];

const float W = 6.283185307 / 2048.0;   // terrain repeats every 2048 m in x and z
const float CELL = 10.24;               // tree grid, 200 cells per repeat
const float TMAX = 360.0;
const vec3 SUN = normalize(vec3(0.55, 0.12, 0.83));
const vec3 SUNC = vec3(1.0, 0.53, 0.23);

// ---------- hashing / noise ----------
// Integer hash: the JS physics mirrors it bit for bit so trees collide where they are drawn.
uint ihash(uint x) {
  x ^= x >> 16u; x *= 0x7feb352du; x ^= x >> 15u; x *= 0x846ca68bu; x ^= x >> 16u;
  return x;
}
float u2f(uint h) { return float(h >> 8u) / 16777216.0; }
float hash21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2(1, 0)), f.x), mix(hash21(i + vec2(0, 1)), hash21(i + vec2(1, 1)), f.x), f.y);
}
float fbm(vec2 p) {
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }
  return s;
}

// ---------- terrain (mirrored exactly in the JS physics) ----------
// biome field: slow regions of dense forest, open meadows, wild or gentle ground; period 65536 m along the slope
float bioAt(float x, float z) { float zb = z + uRzB; return 0.6 * sin(W * 0.28125 * zb + 1.1 + W * x) + 0.4 * sin(W * 0.15625 * zb + 2.3 - W * x); }
float forestAt(float x, float z) { float zz = z + uRz;
  float a = sin(W * 6.0 * x + 0.7) * sin(W * 4.75 * zz + 2.1);
  float b = sin(W * 13.0 * x + W * 11.125 * zz + 0.3);
  return 0.5 + 0.5 * (0.7 * a + 0.3 * b) + 0.3 * bioAt(x, z);
}
// Terraces: where edgeG crosses zero the snow steps down (and, on the far side of each band, gently up again).
// The same field marks where the ground is "interesting": around the drops and in the forest the surface is
// rougher and carries mounds, on open fields it stays smooth and evenly deep.
float edgeG(float x, float z) { float zz = z + uRz; return 0.6 * sin(W * 6.875 * zz + W * 2.0 * x + 0.4) + 0.4 * sin(W * 5.0 * x - W * 4.125 * zz + 2.0); }
float wrapP(float d, float P) { return d - P * floor(d / P + 0.5); }
// A snow-covered river bed (every 1024 m across) and soft ridges (every 512 m) wander down the hill.
float chanC(float z) { float zz = z + uRz; return 35.0 * sin(W * 4.125 * zz + 0.4) + 10.0 * sin(W * 11.125 * zz + 2.0) + 300.0; }
float chanW(float x, float z) { float d = wrapP(x - chanC(z), 1024.0); return exp(-(d * d) / 81.0); }
float ridgeC(float z) { float zz = z + uRz; return 50.0 * sin(W * 2.875 * zz + 2.0) + 12.0 * sin(W * 9.75 * zz + 0.7) + 120.0; }
float ridgeW(float x, float z) { float d = wrapP(x - ridgeC(z), 512.0); return exp(-(d * d) / 36.0); }
// ---------- landforms: rare surprise sections, one candidate per 512 m cell ----------
// types: 0 frozen tarn, 1 gorge, 2 stone stairs, 3 powder bowl, 4 scoured rocky ground
// The two landforms nearest the camera arrive as uniforms, worked out on the CPU by the same code that drives the
// physics: (centre x, centre z, squared bounding radius, packed type / radius / seed). Farther landforms are out of
// the near terrain anyway (beyond ~180 m only the smooth far hill is used). They never overlap.
uniform vec4 uZn0, uZn1;
uniform vec2 uZH;       // for each of the two: ground level at the centre without the downhill slope (the tarn is levelled to it)
float gZH;
bool zUnpack(vec4 q, float x, float z, out float ty, out vec2 d, out float R, out float sd) {
  float c = q.w;
  float sdi = floor(c / 512.0);
  float rem = c - sdi * 512.0;
  float ri = floor(rem / 8.0);
  ty = rem - ri * 8.0; R = ri + 80.0; sd = sdi / 255.0;
  d = vec2(x - q.x, z - q.y);
  if (ty > 0.5 && ty < 1.5) return abs(d.x) < 80.0 && abs(d.y) < R;
  return dot(d, d) < (R + 7.0) * (R + 7.0);
}
bool zoneParams(float x, float z, out float ty, out vec2 d, out float R, out float sd) {
  vec2 a = vec2(x - uZn0.x, z - uZn0.y);
  if (dot(a, a) < uZn0.z && zUnpack(uZn0, x, z, ty, d, R, sd)) { gZH = uZH.x; return true; }
  vec2 b = vec2(x - uZn1.x, z - uZn1.y);
  if (dot(b, b) < uZn1.z && zUnpack(uZn1, x, z, ty, d, R, sd)) { gZH = uZH.y; return true; }
  ty = -1.0; d = vec2(0.0); R = 100.0; sd = 0.0;
  return false;
}
float zLen(vec2 d, float sd) { return length(d) + 6.0 * sin(d.x * 0.07 + sd * 10.0) * sin(d.y * 0.06 + sd * 7.0); }
float gorgeX(vec2 d, float sd) { return 16.0 * sin(d.y * 0.04 + sd * 6.0); }
float gorgeD(vec2 d, float sd) { return abs(d.x - gorgeX(d, sd)) + 2.5 * sin(d.y * 0.23 + sd * 20.0) + 1.5 * sin(d.y * 0.51 + d.x * 0.2); }
float zoneMask(float x, float z, out float ty) {
  vec2 d; float R, sd;
  if (!zoneParams(x, z, ty, d, R, sd)) return 0.0;
  if (ty > 0.5 && ty < 1.5) return (1.0 - smoothstep(0.6, 1.0, abs(d.y) / R)) * (1.0 - smoothstep(26.0, 56.0, abs(d.x - gorgeX(d, sd))));
  return 1.0 - smoothstep(0.55, 1.0, zLen(d, sd) / R);
}
// where trees and cabins must stay away (powder bowls keep their trees)
float zoneClear(float x, float z) { float ty; float w = zoneMask(x, z, ty); return (ty > 2.5 && ty < 3.5) ? 0.0 : w; }
float zoneMaskAny(float x, float z) { float ty; return zoneMask(x, z, ty); }
float rockLump(float x, float z) {
  float l = sin(W * 45.0 * x + 0.5) * sin(W * 39.0 * z + 1.0) + 0.4 * sin(W * 91.0 * x + W * 77.0 * z);
  return 2.2 * smoothstep(0.25, 0.95, l) + 0.7 * smoothstep(0.3, 0.9, sin(W * 131.0 * x + 1.7) * sin(W * 127.0 * z + 0.3));
}
// forest: fewer, separate groves, and none in the river bed
float forestW0(float x, float z) { return smoothstep(0.57, 0.75, forestAt(x, z)) * (1.0 - smoothstep(0.2, 0.6, chanW(x, z))); }
float forestW(float x, float z) { return forestW0(x, z) * (1.0 - smoothstep(0.1, 0.5, zoneClear(x, z))); }
float roughAt(float g, float x, float z) { return max(1.0 - smoothstep(0.15, 0.55, abs(g)), forestW0(x, z)); }
// Short, steep drops: a slow ramp up and a quick drop, in patches, along lines that bend across the slope.
float rollH(float x, float z) { float zz = z + uRz;
  float u = 22.25 * zz / 2048.0 + 5.0 * x / 2048.0 + 0.35 * sin(W * 2.875 * zz + W * 2.0 * x + 1.0);
  float ph = u - floor(u);
  float sawt = ph < 0.88 ? smoothstep(0.0, 0.88, ph) : 1.0 - smoothstep(0.88, 1.0, ph);
  float pat = smoothstep(0.0, 0.5, sin(W * 4.0 * x + 1.3) * sin(W * 4.75 * zz + 0.2) + 0.1);
  return 3.0 * sawt * pat;
}
// The smooth form of the hill, without the small ripples. Shadows use this one: at a 7 degree sun a ripple of
// 0.3 m moves a shadow edge by 2-3 m, which drew long jagged "fangs" along every shadow boundary.
float hgtCore(float x, float z) { float zz = z + uRz;
  float h = -0.36 * z;
  // broad regions of gentler or wilder hills, and stretches where the whole slope is flatter or steeper
  float hs = 9.0 * sin(W * 2.25 * zz + 1.0) + 4.5 * sin(W * 4.75 * zz + 3.1)
           + 2.8 * sin(W * 9.25 * zz + 0.3 + W * 15.0 * x)
           + 6.0 * sin(W * 4.0 * x + 0.8) * sin(W * 2.875 * zz + 2.2)
           + 5.0 * sin(W * 7.0 * x + 2.0) * sin(W * 6.125 * zz + 0.5);
  h += hs * (1.0 + 0.5 * sin(W * 0.5 * zz + 0.9) * sin(W * x + 2.0) + 0.22 * bioAt(x, z));
  h += 85.0 * sin(W * 0.25 * zz + 1.3) + 40.0 * sin(W * 0.375 * zz + 4.0);
  h -= 6.0 * smoothstep(-0.25, 0.25, edgeG(x, z));
  h += rollH(x, z) - 2.4 * chanW(x, z) + 1.9 * ridgeW(x, z);
  return h;
}
float zoneApply(float x, float z, float h, out float calm, out float clr) {
  calm = 0.0; clr = 0.0;
  float ty; vec2 d; float R, sd;
  if (zoneParams(x, z, ty, d, R, sd)) {
  if (ty < 0.5) {
    float w = 1.0 - smoothstep(0.55, 1.0, zLen(d, sd) / R);
    if (w > 0.0) {
      h += (gZH - 0.36 * (z - d.y) - 0.16 * d.y - h) * w;
      calm = w; clr = w;
    }
  } else if (ty < 1.5) {
    float env = 1.0 - smoothstep(0.55, 0.95, abs(d.y) / R);
    h -= 9.0 * env * (1.0 - smoothstep(7.0, 19.0, gorgeD(d, sd)));
    clr = (1.0 - smoothstep(0.6, 1.0, abs(d.y) / R)) * (1.0 - smoothstep(26.0, 56.0, abs(d.x - gorgeX(d, sd))));
  } else if (ty < 2.5) {
    float w = 1.0 - smoothstep(0.55, 1.0, zLen(d, sd) / R);
    float u = d.y / 18.0 + 0.2 * sin(d.x * 0.03 + sd * 9.0);
    float ph = u - floor(u);
    float saw = ph < 0.84 ? mix(ph / 0.84, smoothstep(0.0, 0.84, ph), 0.4) : 1.0 - smoothstep(0.84, 1.0, ph);
    h += 3.2 * saw * w; clr = w;
  } else if (ty < 3.5) {
    float w = 1.0 - smoothstep(0.55, 1.0, zLen(d, sd) / R);
    h += w * (-2.0 * w + 0.9 * sin(d.x * 0.045 + sd * 8.0) * sin(d.y * 0.05 + sd * 5.0));
    calm = w;
  } else if (ty < 4.5) {
    float w = 1.0 - smoothstep(0.55, 1.0, zLen(d, sd) / R);
    if (w > 0.0) h += w * rockLump(x, z);
    clr = w;
  } else if (ty < 5.5) {
    // mesa: a raised, gently sloping table with steep stone sides
    float l = zLen(d, sd) / R;
    float w = 1.0 - smoothstep(0.45, 0.7, l);
    if (w > 0.0) h += (gZH + 9.0 - 0.36 * (z - d.y) - 0.16 * d.y - h) * w;
    clr = 1.0 - smoothstep(0.55, 1.0, l);
  } else if (ty < 6.5) {
    // dunes: long wind-built waves across the slope, each one a small ramp at speed
    float w = 1.0 - smoothstep(0.55, 1.0, zLen(d, sd) / R);
    h += w * (1.5 * sin(d.y * 0.22 + 0.35 * sin(d.x * 0.05 + sd * 9.0) + sd * 20.0) + 0.5 * sin(d.y * 0.5 + d.x * 0.1));
    clr = w;
  } else {
    // kettle: a round bowl with a raised rim
    float l = zLen(d, sd) / R;
    float w = 1.0 - smoothstep(0.85, 1.0, l);
    float rim = exp(-pow((l - 0.8) / 0.1, 2.0));
    h += w * (-8.0 * (1.0 - smoothstep(0.3, 0.75, l)) + 2.0 * rim);
    clr = 1.0 - smoothstep(0.55, 1.0, l);
  }
  }
  return h;
}
float hgtBase(float x, float z) { float cm, cl; return zoneApply(x, z, hgtCore(x, z), cm, cl); }
float hgt0(float x, float z) {
  float fine = 1.5 * sin(W * 19.0 * z + 1.7 - W * 20.0 * x) + 0.55 * sin(W * 41.0 * z + 0.9 + W * 33.0 * x)
             + 1.1 * sin(W * 29.0 * x + W * 13.0 * z + 2.0) + 2.2 * sin(W * 21.0 * x + 1.1) * sin(W * 17.0 * z + 0.4);
  float env = smoothstep(0.55, 0.95, sin(W * 11.0 * z + 2.5 + W * 3.0 * x));
  fine += env * 1.8 * sin(W * 68.0 * z + W * 2.0 * x);
  float cm, cl;
  float hb = zoneApply(x, z, hgtCore(x, z), cm, cl);
  float rg = max(1.0 - smoothstep(0.15, 0.55, abs(edgeG(x, z))), forestW0(x, z) * (1.0 - smoothstep(0.1, 0.5, cl)));
  return hb + fine * (0.3 + 0.7 * rg) * (1.0 - cm);
}

// ---------- snow mounds: smooth bumps in the snow, some with stone showing through ----------
const float CELLR = 12.8;   // 160 cells per repeat
float bumpOf(vec2 d, float rx, float ry) {
  float a = max(1.0 - dot(d, d) / (rx * rx), 0.0);
  return ry * a * a;
}
float rockBump(float x, float z) {
  vec2 pos = vec2(x, z);
  vec2 cell = floor(pos / CELLR);
  vec2 f = pos / CELLR - cell - 0.5;
  vec2 sg = vec2(f.x < 0.0 ? -1.0 : 1.0, f.y < 0.0 ? -1.0 : 1.0);
  float b = 0.0;
  for (int i = 0; i < 4; i++) {
    vec2 c = cell + vec2(float(i & 1), float(i >> 1)) * sg;
    uvec2 ci = uvec2(mod(c, 160.0));
    uint h = ihash((ci.x * 668265263u) ^ (ci.y * 374761393u) ^ 0x2545f491u);
    float r3 = u2f(ihash(h + 3u));
    if (r3 < 0.8) {
      vec2 cp = (c + 0.5 + (vec2(u2f(ihash(h + 1u)), u2f(ihash(h + 2u))) - 0.5) * 0.3) * CELLR;
      vec2 d = pos - cp;
      // few mounds on open fields, many at the drops and among the trees (decided at the cell centre)
      if (dot(d, d) < 16.0 && r3 < 0.24 * smoothstep(0.3, 0.8, roughAt(edgeG(cp.x, cp.y), cp.x, cp.y)) && zoneMaskAny(cp.x, cp.y) < 0.25) {
        float rx = 0.9 + 2.5 * pow(u2f(ihash(h + 4u)), 1.8);
        b += bumpOf(d, rx, rx * (0.2 + 0.16 * u2f(ihash(h + 5u))));
        if (u2f(ihash(h + 6u)) < 0.7) {
          vec2 sp = (vec2(u2f(ihash(h + 7u)), u2f(ihash(h + 8u))) - 0.5) * 3.0;
          float r2 = 0.5 + 0.6 * u2f(ihash(h + 9u));
          b += bumpOf(pos - cp - sp, r2, r2 * 0.3);
        }
      }
    }
  }
  return b;
}
float hgt(float x, float z) { return hgt0(x, z) + rockBump(x, z); }

// Far away only the broad shape of the hill is kept. Its slopes are gentle, so the tracer can take long,
// safe steps there. That removes the ragged silhouettes that came from running out of steps at the horizon.
float hgtLOD(float x, float z) { float zz = z + uRz;
  float h = -0.36 * z;
  // broad regions of gentler or wilder hills, and stretches where the whole slope is flatter or steeper
  float hs = 9.0 * sin(W * 2.25 * zz + 1.0) + 4.5 * sin(W * 4.75 * zz + 3.1)
           + 2.8 * sin(W * 9.25 * zz + 0.3 + W * 15.0 * x)
           + 6.0 * sin(W * 4.0 * x + 0.8) * sin(W * 2.875 * zz + 2.2)
           + 5.0 * sin(W * 7.0 * x + 2.0) * sin(W * 6.125 * zz + 0.5);
  h += hs * (1.0 + 0.5 * sin(W * 0.5 * zz + 0.9) * sin(W * x + 2.0) + 0.22 * bioAt(x, z));
  h += 85.0 * sin(W * 0.25 * zz + 1.3) + 40.0 * sin(W * 0.375 * zz + 4.0);
  h -= 6.0 * smoothstep(-0.25, 0.25, edgeG(x, z));
  h += -2.4 * chanW(x, z) + 1.9 * ridgeW(x, z);
  return h;
}
float hgtT(float x, float z, float tf) {
  float lod = smoothstep(120.0, 180.0, tf);
  if (lod <= 0.0) return hgt(x, z);
  if (lod >= 1.0) return hgtLOD(x, z);
  return mix(hgt(x, z), hgtLOD(x, z), lod);
}

// gSh: while shading (shadow and AO rays) the bounding volumes of trees and the rider are NOT solids. They only
// limit the step length, through gRB. Used as distances they printed rings, squares and false penumbras on the snow.
bool gSh = false; float gRB = 1e5; bool gReal = true;   // gReal: the last mapK distance came from real geometry, not a bounding volume

// ---------- snow-covered tiered conifers on bare trunks ----------
float epsAt(float t) { return 0.0008 * t + 0.002 + 0.0008 * max(t - 150.0, 0.0); }

float sdE(vec3 p, vec3 c, float a, float b) { return (length((p - c) * vec3(1.0, a / b, 1.0)) - a) * (b / a) * 0.9; }
// typ 0: spruce (broad tiers), 1: slim fir (taller, narrower, more tiers), 2: pine (tall bare trunk, layered crown)
vec2 treeSDF(vec3 q, float s, float seed, vec3 pw, float asp, float typ) {
  // soft branches: they part around the rider and thin out around the camera
  // (the thinning is only for the primary view. Shadow and AO rays must see the full tree: with it, every shadow
  //  falling within 3 m of the rider or 4.5 m of the camera had its foliage eaten away and came out as ragged fangs)
  float part = gSh ? 0.0 : max(smoothstep(3.2, 0.7, length(pw - uRPos - vec3(0.0, 0.9, 0.0))), smoothstep(4.5, 1.8, length(pw - uCamPos)));
  // the crowns sway in the gusts (same gust curve as the wind sound), a little more for big trees
  float gust = max(0.0, sin(uTime * 0.23) * sin(uTime * 0.071 + 1.0));
  vec2 swv = vec2(0.30 * gust + 0.04 * sin(uTime * 1.3 + seed * 40.0), 0.05 * sin(uTime * 0.9 + seed * 23.0)) * s;
  if (typ > 1.5) {
    float yb = 1.5 * s + 1.0;
    float k = 1.0 - 0.9 * part;
    float ca = cos(seed * 20.0), sa = sin(seed * 20.0);
    vec3 qs = q - vec3(swv.x, 0.0, swv.y) * clamp((q.y - yb) / (4.0 * s), 0.0, 1.0);
    float cr = sdE(qs, vec3(0.0, yb + 0.6 * s, 0.0), 2.5 * s * k, 0.95 * s * k);
    cr = min(cr, sdE(qs, vec3(0.5 * s * ca, yb + 1.8 * s, 0.5 * s * sa), 1.9 * s * k, 0.8 * s * k));
    cr = min(cr, sdE(qs, vec3(-0.45 * s * sa, yb + 2.85 * s, 0.45 * s * ca), 1.3 * s * k, 0.65 * s * k));
    float tr = max(length(q.xz) - (0.30 * s + 0.05), q.y - (yb + 1.4 * s)) * 0.8;
    return cr < tr ? vec2(cr, 2.0) : vec2(tr, 3.0);
  }
  float fir = typ > 0.5 ? 1.0 : 0.0;
  float H = mix(9.0, 12.5, fir) * s * (0.85 + 0.3 * asp), R0 = mix(2.6, 1.75, fir) * s * (1.0 - 0.2 * asp);
  float y0 = 0.9 + 0.5 * s;
  float y = q.y - y0;                        // branches start well below head height
  float ty = y / H;
  float ph = fract(ty * mix(5.0, 8.0, fir));
  float rad = R0 * pow(max(1.0 - ty, 0.0), mix(1.0, 0.85, fir)) * (mix(0.48, 0.42, fir) + mix(0.52, 0.58, fir) * (1.0 - ph));
  rad *= 1.0 + 0.06 * sin(4.0 * q.x + 3.0 * q.z + seed * 20.0);
  rad *= 1.0 - 0.92 * part;
  rad = max(rad, 0.0045 * length(pw - uCamPos) * clamp((1.0 - ty) * 2.5, 0.0, 1.0));   // far away a needle-thin tip is sub-pixel and sparkles, so keep it blunt
  float ct = clamp(ty, 0.0, 1.0);
  float dr = length(q.xz - swv * ct * ct) - rad;
  float dv = max(-y, y - H);
  float fol = max(dr, dv) * 0.5;
  float trunk = max(length(q.xz) - (0.32 * s + 0.08 * (1.0 - clamp(q.y / 6.0, 0.0, 1.0))), q.y - (y0 + 0.4 * H)) * 0.8;
  return fol < trunk ? vec2(fol, 2.0) : vec2(trunk, 3.0);
}

vec2 trees(vec3 p) {
  vec2 cell = floor(p.xz / CELL);
  vec2 f = p.xz / CELL - cell - 0.5;
  vec2 sg = vec2(f.x < 0.0 ? -1.0 : 1.0, f.y < 0.0 ? -1.0 : 1.0);
  vec2 best = vec2(1e5, 1.0);   // id 1: a bare bound (no tree there) must never be shaded as foliage
  for (int i = 0; i < 4; i++) {
    vec2 c = cell + vec2(float(i & 1), float(i >> 1)) * sg;
    uvec2 ci = uvec2(mod(c, 200.0));
    uint h = ihash((ci.x * 73856093u) ^ (ci.y * 19349663u));
    vec2 tp = (c + 0.5 + (vec2(u2f(ihash(h + 1u)), u2f(ihash(h + 2u))) - 0.5) * 0.3) * CELL;
    vec2 dd = p.xz - tp;
    float hd = length(dd);
    if (hd < 9.0) {
      float r3 = u2f(ihash(h + 3u));
      float dcam = length(tp - uCamPos.xz);
      // trees are not drawn beyond 215 m. They fade into the dark forest tint on the ground first (see shade), so none pop.
      if (r3 < 0.85 && dcam < 215.0 && r3 < forestW(tp.x, tp.y) * 0.85) {
        float rs = u2f(ihash(h + 4u));
        float ra = u2f(ihash(h + 5u));
        float s = 0.4 + 0.85 * pow(rs, 1.5);
        // each tree bounds itself with its own radius, so the distance field is honest everywhere.
        // (A shared worst-case radius drew dark rings in the shadow and ambient occlusion around every tree cell.)
        float rtp = u2f(ihash(h + 6u));
        float typ = rtp < 0.60 ? 0.0 : (rtp < 0.85 ? 1.0 : 2.0);
        float Rt = max((typ < 0.5 ? 2.6 * (1.0 - 0.2 * ra) : (typ < 1.5 ? 1.9 : 2.8)) * s * 1.07, 0.0045 * dcam + 0.05);
        if (hd < Rt + 0.6) {
          vec3 q = vec3(dd.x, p.y - hgt(tp.x, tp.y) + 0.6, dd.y);
          vec2 d = treeSDF(q, s, rs, p, ra, typ);
          // a soft drift of snow piled round the foot of the trunk (look only, the rider ignores it)
          float dr = sdE(q, vec3(0.35 * (ra - 0.5) * s, 0.3, 0.35 * (rtp - 0.5) * s), (1.2 + 0.7 * ra) * s, 0.55 * s);
          if (dr < d.x) d = vec2(dr, 2.0);
          if (d.x < best.x) best = d;
        } else {
          gRB = min(gRB, hd - Rt);
        }
      }
    }
  }
  return best;
}

// ---------- the rider ----------
float sdCapsule(vec3 p, vec3 a, vec3 b, float r) {
  vec3 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - r;
}
float sdRoundBox(vec3 p, vec3 b, float r) {
  vec3 q = abs(p) - b;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - r;
}
float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}
vec2 rmin(vec2 a, vec2 b) { return a.x < b.x ? a : b; }

// q: x = rider's left, y = up from the snow, z = travel direction. Ids: 4 coat, 5 pants, 6 board, 7 hat, 8 scarf, 9 gloves and boots, 10 skin
vec2 riderMap(vec3 q) {
  float c = uCrouch, st = uSteer;
  vec3 bq = q - vec3(0.0, 0.05, 0.0);
  bq.y -= pow(max(abs(bq.z) - 0.5, 0.0), 2.0) * 1.5;
  vec2 r = vec2(sdRoundBox(bq, vec3(0.125, 0.010, 0.80), 0.018), 6.0);
  float hipY = 0.95 - 0.26 * c;
  vec3 hip = vec3(0.02 * c, hipY, 0.0);
  float legs = 1e5, boots = 1e5;
  for (int i = 0; i < 2; i++) {
    float zf = i == 0 ? 0.30 : -0.30;
    vec3 foot = vec3(0.0, 0.11, zf);
    vec3 hp = vec3(0.0, hipY, zf * 0.35);
    vec3 knee = mix(foot, hp, 0.5) + vec3(0.10 + 0.16 * c, 0.0, 0.0);
    legs = min(legs, min(sdCapsule(q, foot, knee, 0.075), sdCapsule(q, knee, hp, 0.088)));
    boots = min(boots, sdCapsule(q, foot + vec3(0.0, -0.03, -0.07), foot + vec3(0.0, 0.0, 0.08), 0.07));
  }
  r = rmin(r, vec2(legs, 5.0));
  r = rmin(r, vec2(boots, 9.0));
  vec3 sh = vec3(0.05 + 0.05 * c, hipY + 0.50 - 0.07 * c, 0.0);
  float coat = sdCapsule(q, hip + vec3(0.0, 0.02, 0.0), sh, 0.165);
  coat = smin(coat, sdCapsule(q, sh + vec3(0.0, 0.0, 0.2), sh + vec3(0.0, 0.0, -0.2), 0.105), 0.06);
  vec3 handF = sh + vec3(0.10, -0.22 - 0.10 * uAir - st * 0.14, 0.60);
  vec3 handB = sh + vec3(0.05, -0.30 + 0.12 * uAir + st * 0.14, -0.52 - 0.04 * sin(uTime * 3.0));
  coat = smin(coat, sdCapsule(q, sh + vec3(0.0, 0.0, 0.2), handF, 0.062), 0.05);
  coat = smin(coat, sdCapsule(q, sh + vec3(0.0, 0.0, -0.2), handB, 0.062), 0.05);
  r = rmin(r, vec2(coat, 4.0));
  float gl = min(length(q - handF) - 0.075, length(q - handB) - 0.075);
  r = rmin(r, vec2(gl, 9.0));
  vec3 hc = sh + vec3(0.0, 0.31, 0.07);
  r = rmin(r, vec2(length(q - hc) - 0.115, 10.0));
  float hat = max(length(q - hc - vec3(0.0, 0.03, -0.01)) - 0.138, (hc.y - 0.02) - q.y);
  r = rmin(r, vec2(hat, 7.0));
  r = rmin(r, vec2(length(q - hc - vec3(0.0, 0.17, -0.02)) - 0.05, 8.0));
  vec3 nk = sh + vec3(0.0, 0.11, 0.0);
  float scarf = sdCapsule(q, nk + vec3(0.0, 0.0, -0.08), nk + vec3(0.0, 0.0, 0.08), 0.085);
  vec3 sa = nk + vec3(0.0, -0.01, -0.09);
  vec3 sm = sa + vec3(0.05 * sin(uTime * 7.0), -0.03 + 0.03 * sin(uTime * 5.0 + 1.0), -0.16 - 0.01 * uSpeed);
  vec3 sb = sm + vec3(0.08 * sin(uTime * 8.0 + 2.0), -0.05 + 0.03 * sin(uTime * 6.0), -0.16 - 0.01 * uSpeed);
  scarf = min(scarf, min(sdCapsule(q, sa, sm, 0.042), sdCapsule(q, sm, sb, 0.036)));
  r = rmin(r, vec2(scarf, 8.0));
  return r;
}

// ---------- cabins: a cosy log cabin on some open ground, one candidate per 256 m cell ----------
bool cabinCell(vec2 cell, out vec2 cp, out float yaw) {
  uvec2 ci = uvec2(mod(cell, 8.0));
  uint h = ihash((ci.x * 2246822519u) ^ (ci.y * 3266489917u) ^ 0x9e3779b1u);
  cp = (cell + vec2(0.2 + 0.6 * u2f(ihash(h + 2u)), 0.2 + 0.6 * u2f(ihash(h + 3u)))) * 256.0;
  yaw = u2f(ihash(h + 4u)) * 6.2831853;
  return u2f(ihash(h + 1u)) < 0.6;
}
bool cabinSiteOk(vec2 cp) { return zoneMaskAny(cp.x, cp.y) < 0.02 && forestAt(cp.x, cp.y) < 0.45 && chanW(cp.x, cp.y) < 0.1 && abs(edgeG(cp.x, cp.y)) > 0.5; }
float sdBoxF(vec3 p, vec3 b) { vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }
// q: x across the gable, y up from the ground at the centre, z toward the front (door and window). Ids: 11 logs, 12 roof snow, 13 window, 14 chimney stone, 9 door
float smx(float a, float b, float k) { float h = max(k - abs(a - b), 0.0) / k; return max(a, b) + h * h * k * 0.25; }
vec2 cabinSDF(vec3 q) {
  vec2 r = vec2(sdBoxF(q - vec3(0.0, 0.45, 0.0), vec3(2.5, 1.95, 1.8)), 11.0);
  // a soft, rounded blanket of snow: smooth edges, a rounded ridge and gentle lumps instead of a sharp wedge
  float rr1 = (q.y - (2.28 + (2.95 - sqrt(q.x * q.x + 0.12)) * 0.5)) * 0.894;
  float roof = smx(smx(rr1, 2.34 - q.y, 0.55), abs(q.z) - 2.05, 0.55) - 0.1 - 0.035 * sin(q.x * 2.6 + 0.7) * sin(q.z * 2.1 + 0.3);
  if (roof < r.x) r = vec2(roof, 12.0);
  float win = sdBoxF(q - vec3(-0.9, 1.3, 1.8), vec3(0.5, 0.4, 0.03));
  if (win < r.x) r = vec2(win, 13.0);
  float door = sdBoxF(q - vec3(0.95, 0.85, 1.8), vec3(0.4, 0.85, 0.03));
  if (door < r.x) r = vec2(door, 9.0);
  float ch = sdBoxF(q - vec3(1.4, 3.15, -0.7), vec3(0.3, 0.95, 0.3));
  if (ch < r.x) r = vec2(ch, 14.0);
  return r;
}
// distance to the cabin of p's cell. Bounds (far from it) go to gRB, the real shape inside.
vec2 cabinMap(vec3 p) {
  vec2 cp; float yaw;
  vec2 cell = floor(p.xz / 256.0);
  if (!cabinCell(cell, cp, yaw)) return vec2(1e5, 11.0);
  vec2 d = p.xz - cp;
  float hd = length(d);
  if (hd > 9.0) { gRB = min(gRB, hd - 6.5); return vec2(1e5, 11.0); }
  if (!cabinSiteOk(cp)) return vec2(1e5, 11.0);
  float cy = cos(yaw), sy = sin(yaw);
  vec3 q = vec3(d.x * cy - d.y * sy, p.y - hgt(cp.x, cp.y), d.x * sy + d.y * cy);
  return cabinSDF(q);
}
// warm light from the window spilling on the snow in front of the cabin
vec3 cabinGlow(vec3 p, vec3 n) {
  vec2 cp; float yaw;
  vec2 cell = floor(p.xz / 256.0);
  if (!cabinCell(cell, cp, yaw)) return vec3(0.0);
  vec2 d = p.xz - cp;
  float hd = length(d);
  if (hd > 32.0 || !cabinSiteOk(cp)) return vec3(0.0);
  float cy = cos(yaw), sy = sin(yaw);
  vec2 loc = vec2(d.x * cy - d.y * sy, d.x * sy + d.y * cy);     // local x, z
  vec2 rel = loc - vec2(-0.9, 1.8);
  float front = smoothstep(-0.5, 1.5, rel.y);                      // only in front of the window
  float fall = exp(-dot(rel, rel) / (2.0 * 7.0 * 7.0));
  float up = 0.35 + 0.65 * max(n.y, 0.0);
  return vec3(2.1, 1.05, 0.38) * fall * front * up * 0.7;
}

// ---------- scene ----------
// kT scales the terrain distance. 0.55 is safe for sphere tracing, shadows can use a value near 1.
vec2 mapK(vec3 p, float kT) {
  gRB = 1e5;
  float tf = length(p - uCamPos);
  float lod = smoothstep(120.0, 180.0, tf);
  float h0 = lod <= 0.0 ? hgt0(p.x, p.z) : (lod >= 1.0 ? hgtLOD(p.x, p.z) : mix(hgt0(p.x, p.z), hgtLOD(p.x, p.z), lod));
  float hh0 = p.y - h0;
  // mounds are at most 1.3 m high, so higher up the plain heightfield bound is enough
  float hh = hh0 >= 6.0 ? hh0 - 1.4 : (lod < 1.0 ? hh0 - (1.0 - lod) * rockBump(p.x, p.z) : hh0);
  kT = kT < 0.9 ? mix(kT, 0.8, lod) : kT;
  vec2 r = vec2(hh * kT, 1.0);
  if (hh0 < 20.0) {
    if (hh0 > 8.0) r.x = min(r.x, 5.0);
    if (length(p - uCamPos) > 1.0 && uDbg.z > 0.5 && length(p.xz - uCamPos.xz) < 225.0) {
      vec2 t = trees(p);
      if (t.x < r.x) r = t;
    }
  } else {
    r.x = (hh0 - 17.0) * 0.5;
  }
  vec3 d = p - uRPos;
  float dl = length(d);
  if (dl < 2.6) {
    vec2 rm = riderMap(vec3(dot(d, uRX), dot(d, uRY), dot(d, uRZ)));
    if (rm.x < r.x) r = rm;
  } else {
    gRB = min(gRB, dl - 2.3);
  }
  if (hh0 < 20.0) {
    vec2 cb = cabinMap(p);
    if (cb.x < r.x) r = cb;
  }
  gReal = r.x <= gRB;
  if (!gSh) r.x = min(r.x, gRB);
  return r;
}
// Trees and rider only, for shadow rays. Real surface distance in .x, distance to the nearest bound in gRB.
float mapObj(vec3 p) {
  gRB = 1e5;
  float r = 1e5;
  if (uDbg.z > 0.5 && length(p.xz - uCamPos.xz) < 225.0 && length(p - uCamPos) > 1.0) r = trees(p).x;
  vec3 d = p - uRPos;
  float dl = length(d);
  if (dl < 2.6) r = min(r, riderMap(vec3(dot(d, uRX), dot(d, uRY), dot(d, uRZ))).x);
  else gRB = min(gRB, dl - 2.3);
  r = min(r, cabinMap(p).x);
  return r;
}
vec2 mapM(vec3 p) { return mapK(p, 0.55); }
float mapD(vec3 p) { return mapK(p, 0.55).x; }
// ---------- atmosphere ----------
// BG-BEGIN
vec3 fogColor(vec3 rd) {
  float s = pow(max(dot(rd, SUN), 0.0), 3.0);
  return mix(vec3(0.30, 0.25, 0.50), vec3(1.0, 0.50, 0.27), s * 0.85 + 0.08);
}

// the smooth part of the sky: gradient, glow around the sun and the sun itself (no clouds, stars or birds)
vec3 skyLite(vec3 rd) {
  float y = max(rd.y, 0.0);
  float sd = max(dot(rd, SUN), 0.0);
  vec3 hor = vec3(1.0, 0.42, 0.18), mid = vec3(0.74, 0.30, 0.46), up = vec3(0.22, 0.19, 0.50), zen = vec3(0.04, 0.06, 0.22);
  vec3 col = mix(hor, mid, smoothstep(0.0, 0.12, y));
  col = mix(col, up, smoothstep(0.08, 0.42, y));
  col = mix(col, zen, smoothstep(0.35, 1.0, y));
  float towards = dot(normalize(rd.xz + 1e-4), normalize(SUN.xz));
  col = mix(col * vec3(0.5, 0.58, 0.85), col, smoothstep(-0.4, 0.8, towards));
  col += SUNC * (pow(sd, 8.0) * 0.45 + pow(sd, 60.0) * 1.2);
  col += vec3(6.0, 4.2, 2.4) * smoothstep(0.9994, 0.9998, sd);
  return col;
}
// the three mountain ranges and the haze at the horizon, laid over a sky colour
vec3 farLayers(vec3 rd, vec3 col) {
  vec3 haze = fogColor(rd);
  float az = atan(rd.x, rd.z);
  vec2 sdir = normalize(SUN.xz);
  float lit = pow(max(dot(vec2(sin(az), cos(az)), sdir), 0.0), 3.0);
  float m2 = 0.05 + 0.03 * sin(az * 3.7 + 5.0) + 0.016 * sin(az * 8.9 + 1.0);
  float m1 = 0.012 + 0.04 * (0.5 + 0.5 * sin(az * 2.1 + 1.0)) + 0.018 * sin(az * 5.3 + 0.4) + 0.009 * sin(az * 11.7 + 2.0);
  vec3 c2 = mix(vec3(0.46, 0.38, 0.60), vec3(1.0, 0.62, 0.52), lit * 0.8);
  vec3 c1 = mix(vec3(0.27, 0.22, 0.44), vec3(0.85, 0.46, 0.40), lit * 0.7);
  float rid = 0.5 * abs(sin(az * 7.3 + 0.8)) + 0.25 * abs(sin(az * 17.0 + 2.0)) + 0.1 * abs(sin(az * 31.0 + 0.3));
  float m3 = 0.055 + 0.075 * rid;
  vec3 c3 = mix(vec3(0.58, 0.47, 0.70), vec3(1.0, 0.68, 0.62), lit * 0.9);
  c3 = mix(c3, vec3(1.0, 0.80, 0.72), smoothstep(m3 - 0.022, m3, rd.y) * (0.35 + 0.6 * lit));
  col = mix(col, mix(c3, haze, 0.4), smoothstep(m3, m3 - 0.0025, rd.y));
  col = mix(col, mix(c2, haze, 0.25), smoothstep(m2, m2 - 0.003, rd.y));
  col = mix(col, mix(c1, haze, 0.15), smoothstep(m1, m1 - 0.003, rd.y));
  col = mix(col, haze, smoothstep(0.02, -0.14, rd.y));
  return col;
}
// BG-END

vec3 sky(vec3 rd) {
  float y = max(rd.y, 0.0);
  float sd = max(dot(rd, SUN), 0.0);
  vec3 hor = vec3(1.0, 0.42, 0.18), mid = vec3(0.74, 0.30, 0.46), up = vec3(0.22, 0.19, 0.50), zen = vec3(0.04, 0.06, 0.22);
  vec3 col = mix(hor, mid, smoothstep(0.0, 0.12, y));
  col = mix(col, up, smoothstep(0.08, 0.42, y));
  col = mix(col, zen, smoothstep(0.35, 1.0, y));
  float towards = dot(normalize(rd.xz + 1e-4), normalize(SUN.xz));
  col = mix(col * vec3(0.5, 0.58, 0.85), col, smoothstep(-0.4, 0.8, towards));
  col += SUNC * (pow(sd, 8.0) * 0.45 + pow(sd, 60.0) * 1.2);
  col += vec3(6.0, 4.2, 2.4) * smoothstep(0.9994, 0.9998, sd);
  vec2 cuv = rd.xz / (rd.y + 0.09) * vec2(0.55, 1.5);
  float cl = smoothstep(0.48, 0.82, fbm(cuv * 1.3 + vec2(uTime * 0.01, 0.0)));
  cl *= smoothstep(0.0, 0.14, rd.y) * (1.0 - smoothstep(0.5, 0.9, rd.y));
  vec3 ccol = mix(vec3(0.30, 0.22, 0.46), vec3(1.0, 0.52, 0.34) * 1.5, clamp(pow(sd, 1.2) + 0.2, 0.0, 1.0));
  // the cloud's sunward edge is thin and catches the light: golden rims, a darker belly
  float d1 = fbm(cuv * 1.3 + vec2(uTime * 0.01, 0.0)), d2 = fbm((cuv + normalize(SUN.xz * vec2(0.55, 1.5)) * 0.07) * 1.3 + vec2(uTime * 0.01, 0.0));
  float rimL = clamp((d1 - d2) * 7.0 + 0.0, 0.0, 1.0) * smoothstep(0.1, 0.5, cl);
  ccol = mix(ccol * 0.85, ccol, 0.5 + 0.5 * clamp(rimL * 2.0, 0.0, 1.0)) + vec3(1.0, 0.62, 0.30) * rimL * 1.3;
  col = mix(col, ccol, cl * 0.8);
  // thin high cirrus, stretched into long streaks and tinted pink and gold by the low sun
  vec2 cu2 = rd.xz / (rd.y + 0.22) * vec2(0.22, 2.4);
  float c2 = smoothstep(0.5, 0.85, fbm(cu2 * vec2(1.0, 2.2) + vec2(uTime * 0.006, 3.0))) * smoothstep(0.08, 0.3, rd.y) * (1.0 - smoothstep(0.65, 1.0, rd.y));
  col += mix(vec3(0.55, 0.22, 0.38), vec3(1.0, 0.6, 0.35), clamp(pow(sd, 1.5) + 0.25, 0.0, 1.0)) * c2 * 0.45;
  // first stars in the dark upper sky, away from the sun
  {
    float vis = smoothstep(0.32, 0.7, rd.y) * (1.0 - smoothstep(0.0, 0.7, sd)) * (1.0 - 0.8 * cl);
    if (vis > 0.01) {
      vec3 sp = rd * 80.0;
      vec3 ci = floor(sp);
      float hs = hash21(ci.xy + ci.z * 37.7);
      if (hs > 0.94) {
        vec3 off = vec3(hash21(ci.yz + 3.1), hash21(ci.zx + 7.7), hash21(ci.xy + 1.9)) * 0.6 + 0.2;
        float d = length(sp - ci - off);
        float tw = 0.65 + 0.35 * sin(uTime * (2.0 + 3.0 * hs) + hs * 60.0);
        col += vec3(0.9, 0.92, 1.0) * smoothstep(0.2, 0.0, d) * tw * vis * (0.6 + 2.0 * (hs - 0.94) * 16.0);
      }
    }
  }
  // a few birds far off, wings flapping
  {
    float az0 = atan(rd.x, rd.z);
    float el = asin(clamp(rd.y, -1.0, 1.0));
    for (int i = 0; i < 4; i++) {
      float fi = float(i);
      float a0 = 0.15 + 0.33 * fi + 0.014 * uTime * (0.7 + 0.15 * fi);
      float e0 = 0.20 + 0.05 * fi + 0.012 * sin(uTime * 0.4 + fi * 2.0);
      float dx = mod(az0 - a0 + 3.14159265, 6.2831853) - 3.14159265;
      vec2 b = vec2(dx * cos(e0), el - e0);
      if (abs(b.x) < 0.022 && abs(b.y) < 0.022) {
        float flap = sin(uTime * (5.0 + fi) + fi * 3.0);
        float wy = -abs(b.x) * (0.4 + 0.45 * flap);
        float on = smoothstep(0.022, 0.0, abs(b.x)) * smoothstep(0.0036, 0.0014, abs(b.y - wy));
        col = mix(col, vec3(0.10, 0.07, 0.16), on * 0.85);
      }
    }
  }
  return col;
}

vec3 farScene(vec3 rd) { return farLayers(rd, sky(rd)); }

// ---------- shading helpers ----------
float ign(vec2 p) { return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }

// Soft shadow, in two passes with different jobs.
// A) Terrain and mounds: a heightfield march whose step grows with t, so it always reaches 90 m (the old loop
//    ran out of steps after 3-10 m at this sun angle, so whether it met a ridge depended on the pixel: contour
//    terraces). Far away the fine ripples are blended out so thin features are not under-sampled (rings).
// B) Trees and rider: a march that only takes short steps near them. Their bounding volumes limit the step
//    but never count as occluders.
// The penumbra is the angular margin between the sun and the occluder, gap/t. The sun is at ~7 degrees, so
// even perfectly flat snow has a margin of only 0.12 rad: k must be 1/(0.8*sun height), or flat sunlit snow
// would be partly shadowed by itself.
float softShadow(vec3 ro, vec3 rd, vec2 fc, float tHit) {
  gSh = true;
  float k = 1.0 / (0.8 * rd.y);
  float res = 1.0, t = 0.12;
  // heights are measured relative to the receiving point on the smooth hill, so the receiver's own ripples
  // never put the ray inside the ground
  float refH = ro.y - (hgtBase(ro.x, ro.z) + rockBump(ro.x, ro.z)) - 0.1;
  for (int i = 0; i < 84; i++) {
    vec3 p = ro + rd * t;
    float lod = smoothstep(25.0, 70.0, t);
    float h0 = lod <= 0.0 ? hgtBase(p.x, p.z) : (lod >= 1.0 ? hgtLOD(p.x, p.z) : mix(hgtBase(p.x, p.z), hgtLOD(p.x, p.z), lod));
    if (t < 10.0) h0 += rockBump(p.x, p.z) * (1.0 - smoothstep(5.0, 10.0, t));
    float gap = p.y - h0 - refH;
    float mg = k * gap / t;
    res = min(res, mg);
    if (res < 0.01) break;
    // coarse steps while the sun is clearly clear of the ground; fine steps near a shadow edge, where a coarse
    // step can jump over a lip and print teeth along the boundary on steep ground
    t += mg > 1.15 ? max(0.04 + 0.1 * t, 0.35 * gap) : max(0.02 + 0.025 * t, 0.2 * gap);
    if (t > 70.0) break;
  }
  if (res >= 0.01 && uDbg.z > 0.5 && tHit < 85.0) {
    t = 0.12;
    for (int i = 0; i < 30; i++) {
      float h = mapObj(ro + rd * t);
      res = min(res, 0.7 * k * h / t);
      if (res < 0.01) break;
      t += clamp(0.8 * min(h, gRB), 0.05, 4.0);
      if (t > 60.0) break;
    }
  }
  gSh = false;
  res = clamp(res, 0.0, 1.0);
  return res * res * (3.0 - 2.0 * res);
}

vec3 calcNormal(vec3 p, float t) {
  float e = 0.0015 + 0.0012 * t;
  vec2 k = vec2(1.0, -1.0);
  return normalize(k.xyy * mapD(p + k.xyy * e) + k.yyx * mapD(p + k.yyx * e) + k.yxy * mapD(p + k.yxy * e) + k.xxx * mapD(p + k.xxx * e));
}

float snowDetail(vec2 q) { return 0.6 * vnoise(q * 0.9) + 0.4 * vnoise(q * 2.7 + 5.0); }

vec3 terrainNormal(vec3 p, float t) {
  float e = 0.05 + 0.012 * t;     // wider at range, so tiny terrain waves do not shimmer
  float h0 = hgtT(p.x, p.z, t);
  vec3 n = normalize(vec3(h0 - hgtT(p.x + e, p.z, t), e, h0 - hgtT(p.x, p.z + e, t)));
  if (t < 90.0) {
    // soft wind-packed bumps from noise, no regular stripes
    float d0 = snowDetail(p.xz), de = 0.15;
    vec2 g = vec2(d0 - snowDetail(p.xz + vec2(de, 0.0)), d0 - snowDetail(p.xz + vec2(0.0, de))) / de;
    float zty; float zwn = zoneMask(p.x, p.z, zty);
    float calmN = (zty < 0.5 || (zty > 2.5 && zty < 3.5)) ? zwn : 0.0;
    n = normalize(n + vec3(g.x, 0.0, g.y) * 0.04 * exp(-t * 0.04) * (1.0 - 0.8 * calmN));
    // Exposed lips and ridges are scoured by the wind: fine ripples lying across the wind (it blows along +x).
    float wm = max(1.0 - smoothstep(0.1, 0.45, abs(edgeG(p.x, p.z))), ridgeW(p.x, p.z));
    wm *= 1.0 - calmN;
    if (wm > 0.02 && t < 60.0) {
      vec2 q0 = vec2(p.x * 0.22, p.z * 2.6);
      float r0 = vnoise(q0) + 0.5 * vnoise(q0 * vec2(2.3, 2.1) + 7.0);
      vec2 dq = vec2(0.15 * 0.22, 0.15 * 2.6);
      float rx = vnoise(q0 + vec2(dq.x, 0.0)) + 0.5 * vnoise((q0 + vec2(dq.x, 0.0)) * vec2(2.3, 2.1) + 7.0);
      float rz = vnoise(q0 + vec2(0.0, dq.y)) + 0.5 * vnoise((q0 + vec2(0.0, dq.y)) * vec2(2.3, 2.1) + 7.0);
      n = normalize(n + vec3(r0 - rx, 0.0, r0 - rz) / 0.15 * 0.035 * wm * exp(-t * 0.04));
    }
  }
  return n;
}

// Soft snow tracks. Each recorded point carries a strength (0 while airborne). The groove is a smooth profile
// with a small raised shoulder, and its slope bends the surface normal, so the light and shade on the two
// sides are what make it read as a furrow. Older parts of the track are shallower and wider as the snow settles.
void trackDeform(vec2 xz, inout vec3 n, out float occ, float pw) {
  occ = 0.0;
  float best = 1e5, bestAge = 0.0, bestStr = 0.0, bestTurn = 0.0, bestSd = 0.0;
  vec2 away = vec2(0.0), tang = vec2(0.0, 1.0);
  for (int i = 0; i < 47; i++) {
    vec4 a = uTrail[i], b = uTrail[i + 1];
    if (a.z > 0.01 && b.z > 0.01) {
      vec2 pa = xz - a.xy, ba = b.xy - a.xy;
      float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-4), 0.0, 1.0);
      vec2 dv = pa - ba * h;
      float d = length(dv);
      float age = float(i) / 47.0;
      float score = d + age * 0.3;
      if (score < best) {
        best = score; bestAge = age; bestStr = mix(a.z, b.z, h); bestTurn = mix(a.w, b.w, h);
        away = dv / max(d, 1e-3); tang = normalize(ba + vec2(1e-4));
        bestSd = dot(dv, vec2(ba.y, -ba.x)) / max(length(ba), 1e-3);   // + = left of the travel direction
      }
    }
  }
  if (best > 3.0 + 1.5 * pw) return;
  float d = best - bestAge * 0.3;
  // Straight riding leaves a broad, shallow board print. A hard carve cuts a narrow, deeper groove and shoves
  // a ridge of snow up on the outside of the turn.
  float sharp = clamp(abs(bestTurn), 0.0, 1.0);
  // a hard turn skids: the board slides sideways, so the furrow is wider, ragged and ploughs a berm up on the outside.
  // In powder the board sinks: much deeper and wider, with soft collapsing walls.
  float chat = sin(dot(xz, tang) * 11.0 + 3.0 * vnoise(xz * 1.3)) * 0.5 + 0.5;
  float w = (0.2 + 0.18 * bestAge) * mix(1.0, 2.1, sharp) * (1.0 + 0.8 * pw);
  float D = 0.11 * (1.0 - 0.7 * bestAge) * bestStr * mix(0.9, 1.8, sharp) * (1.0 + 2.6 * pw) * (1.0 + 0.4 * sharp * chat);
  float outer = (bestSd * bestTurn < 0.0) ? 1.0 : 0.0;
  float berm = 0.35 * mix(1.0, outer > 0.5 ? 3.6 : 0.5, sharp) * (1.0 + 0.5 * pw);
  float g = exp(-(d / w) * (d / w));
  float sx = (d - 2.0 * w) / (0.8 * w);
  float sh = exp(-sx * sx);
  float slope = D * 2.0 * d / (w * w) * g - berm * D * 2.0 * sx / (0.8 * w) * sh;
  n = normalize(n - vec3(slope * away.x, 0.0, slope * away.y));
  occ = g * bestStr * (1.0 - 0.6 * bestAge) * mix(0.8, 1.3, sharp);
}

vec3 shade(vec3 ro, vec3 rd, float t, float id) {
  vec3 p = ro + rd * t;
  vec3 n;
  vec3 alb;
  float farT = 0.0;
  float iceG = 0.0;
  float grooveOcc = 0.0;   // how far this surface has faded into the distant-forest tone
  if (id < 1.5) {
    // The march stops within a tolerance of the snow. At grazing angles that is a long way along the
    // ground and shows up as stripes, so slide the hit point onto the exact surface first.
    for (int k = 0; k < 3; k++) {
      float e = 0.1 + 0.004 * t;
      float h0 = hgtT(p.x, p.z, t);
      vec2 gr = vec2(hgtT(p.x + e, p.z, t) - h0, hgtT(p.x, p.z + e, t) - h0) / e;
      float dfdt = rd.y - gr.x * rd.x - gr.y * rd.z;
      float lim = 0.02 * t + 0.3;
      float tn = t - clamp((p.y - h0) / (abs(dfdt) > 0.02 ? dfdt : (dfdt < 0.0 ? -0.02 : 0.02)), -lim, lim);
      vec3 pn = ro + rd * tn;
      // only accept a step that really lands closer to the surface. At a sharp lip a long slide along a
      // grazing ray can jump onto the terrace below, which showed up as a dashed dark line along the crest.
      if (abs(pn.y - hgtT(pn.x, pn.z, tn)) < abs(p.y - h0)) { t = tn; p = pn; } else break;
    }
    n = terrainNormal(p, t);
    alb = vec3(0.90, 0.93, 1.0);
    alb *= 0.93 + 0.07 * vnoise(p.xz * 0.35);
    alb *= vec3(1.0 + 0.035 * (vnoise(p.xz * 0.045) - 0.5), 1.0, 1.0 - 0.04 * (vnoise(p.xz * 0.045 + 9.0) - 0.5));   // faint warm and cool patches in the snow
    alb = mix(alb, vec3(0.78, 0.87, 1.0), 0.4 * chanW(p.x, p.z));   // the river bed: slightly cooler, smoother snow
    // landforms: ice on the tarn, rock on steep gorge walls and stair faces, bare ground where the snow is thin, soft powder
    float zt; float zw = zoneMask(p.x, p.z, zt);
    float iceM = 0.0, rockM = 0.0;
    if (zw > 0.0) {
      vec2 zd; float zR, zsd; zoneParams(p.x, p.z, zt, zd, zR, zsd);
      float stp = 1.0 - smoothstep(0.55, 0.86, n.y + 0.25 * (vnoise(p.xz * 1.3) - 0.5));
      if (zt < 0.5) iceM = 1.0 - smoothstep(0.42, 0.5, (zLen(zd, zsd) + 5.0 * (vnoise(p.xz * 0.08) - 0.5)) / zR);
      else if (zt < 2.5 || zt > 4.5) rockM = (zt > 5.5 && zt < 6.5) ? 0.0 : stp * smoothstep(0.05, 0.4, zw);
      else if (zt < 3.5) alb = mix(alb, vec3(0.80, 0.90, 1.04), zw * 0.55);
      else rockM = zw * max(smoothstep(0.55, 0.9, rockLump(p.x, p.z) / 2.2 + 0.25 * vnoise(p.xz * 1.1)), stp);
    }
    iceG = iceM;
    if (iceM > 0.0) {
      float dust = smoothstep(0.5, 0.75, vnoise(p.xz * 0.11) + 0.45 * vnoise(p.xz * 0.5) - 0.2);
      float crack = 1.0 - smoothstep(0.0, 0.025, abs(vnoise(p.xz * 0.4 + 3.0) - 0.5));
      vec3 ice = mix(vec3(0.16, 0.30, 0.42), vec3(0.88, 0.94, 1.02), max(dust, crack * 0.35));
      alb = mix(alb, ice, iceM);
    }
    if (rockM > 0.0) {
      float band = 0.5 + 0.5 * sin(p.y * 2.6 + 2.0 * vnoise(p.xz * 0.35));
      vec3 rk = mix(vec3(0.36, 0.26, 0.21), vec3(0.19, 0.17, 0.20), band) * (0.75 + 0.5 * vnoise(p.xz * 4.0 + p.y));
      alb = mix(alb, rk, rockM * 0.96);
    }
    alb *= 1.0 + vec3(0.025, 0.0, -0.035) * bioAt(p.x, p.z);   // meadows run a touch warmer, high rock country a touch colder
    // fine wind ripples across the open snow near the camera, a few centimetres high, catching the low sun
    if (uDbg2.x > 0.5 && t < 42.0 && iceM < 0.5 && rockM < 0.5 && n.y > 0.8) {
      float ra = p.z * 4.6 + p.x * 0.9 + 2.4 * vnoise(p.xz * 0.45);
      float fadeR = (1.0 - smoothstep(12.0, 42.0, t)) * (0.5 + 0.5 * vnoise(p.xz * 0.12 + 5.0));
      n = normalize(n + vec3(0.25 * cos(ra * 0.7), 0.0, cos(ra)) * 0.035 * fadeR);
    }
    float mound = rockBump(p.x, p.z);
    float steep = 1.0 - smoothstep(0.62, 0.9, n.y + 0.3 * (vnoise(p.xz * 2.2) - 0.5));
    alb = mix(alb, vec3(0.30, 0.29, 0.33) * (0.75 + 0.5 * vnoise(p.xz * 6.0)), smoothstep(0.1, 0.35, mound) * steep * 0.92);
    // beyond the range where trees are drawn, forest shows as a dark mottled tint on the ground
    float forest = forestW(p.x, p.z);
    farT = smoothstep(110.0, 220.0, t) * forest * (0.7 + 0.3 * vnoise(p.xz * 0.22)) * 0.92;
    if (uDbg2.x > 0.5 && t < 70.0 && length(p.xz - uRPos.xz) < 52.0) {
      float pty; float pzw = zoneMask(p.x, p.z, pty); float pwd = (pty > 2.5 && pty < 3.5) ? pzw : 0.0;
      if (!(pty < 0.5 && pzw > 0.4)) trackDeform(p.xz, n, grooveOcc, pwd);
      alb *= mix(vec3(1.0), vec3(0.80, 0.88, 1.0), clamp(grooveOcc * 1.3, 0.0, 1.0));   // the packed snow in a groove glows slightly blue
    }
  } else {
    n = calcNormal(p, t);
    if (id < 2.5) {
      float snow = smoothstep(0.30, 0.68, n.y + 0.12 * vnoise(p.xz * 1.7 + p.y));
      alb = mix(vec3(0.030, 0.095, 0.075) * (0.8 + 0.5 * vnoise(p.xz * 3.0)), vec3(0.92, 0.94, 1.0), snow * 0.93);
    } else if (id < 3.5) alb = vec3(0.09, 0.055, 0.04);
    else if (id < 4.5) alb = vec3(0.80, 0.17, 0.10);
    else if (id < 5.5) alb = vec3(0.07, 0.09, 0.17);
    else if (id < 6.5) alb = mix(vec3(0.10, 0.50, 0.52), vec3(0.95, 0.85, 0.68), smoothstep(0.55, 0.7, abs(dot(p - uRPos, uRZ))));
    else if (id < 7.5) alb = vec3(0.95, 0.70, 0.16);
    else if (id < 8.5) alb = vec3(0.96, 0.88, 0.78);
    else if (id < 9.5) alb = vec3(0.12, 0.08, 0.07);
    else if (id < 10.5) alb = vec3(0.85, 0.58, 0.45);
    else if (id < 11.5) alb = vec3(0.30, 0.135, 0.075) * (0.8 + 0.4 * vnoise(vec2(p.y * 7.0, p.x + p.z)));   // logs
    else if (id < 12.5) alb = vec3(0.93, 0.95, 1.0);                                                           // snow on the roof
    else if (id < 13.5) alb = vec3(0.02);                                                                      // window (emissive, below)
    else alb = vec3(0.34, 0.31, 0.32);                                                                         // chimney
  }
  float ndl = dot(n, SUN);
  float sh = 1.0;
  if (ndl > 0.0 && t < 110.0 && uDbg.x > 0.5) sh = softShadow(p + n * (0.07 + 0.004 * t), SUN, gl_FragCoord.xy, t);
  sh = mix(sh, 0.55, smoothstep(55.0, 110.0, t));   // far hills: no flickering shadow edges
  float ao = 1.0;
  if (uDbg.y > 0.5 && t < 120.0) { gSh = true; ao = clamp(mapD(p + n * 0.6) / 0.33, 0.0, 1.0); gSh = false; }
  ao = mix(0.38, 1.0, ao) * (1.0 - 0.35 * grooveOcc);
  vec3 amb = mix(vec3(0.10, 0.12, 0.27), vec3(0.32, 0.28, 0.52), 0.5 + 0.5 * n.y) * ao;
  float bounce = max(dot(n, -normalize(vec3(SUN.x, 0.0, SUN.z))), 0.0);
  vec3 lit = SUNC * (5.2 * max(ndl, 0.0) * sh) + amb + vec3(0.30, 0.16, 0.26) * bounce * 0.5 * ao;
  if (id < 1.5) lit += vec3(0.9, 0.34, 0.17) * 0.55 * ao * smoothstep(-0.28, 0.04, ndl) * (1.0 - smoothstep(0.04, 0.42, ndl));   // sunlight scattering through snow glows at the shadow edge
  if (id < 1.5 && t < 120.0) lit += cabinGlow(p, n);
  vec3 col = alb * lit;
  if (id > 12.5 && id < 13.5) col = vec3(3.2, 1.7, 0.7) * (0.92 + 0.08 * sin(uTime * 9.0 + p.x * 3.0));   // the window glows
  // the river bed is wind-polished and smoother: a stronger, tighter glint
  if (id < 1.5) col += SUNC * pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 3.0) * 0.5 * sh * chanW(p.x, p.z) * smoothstep(0.0, 0.2, ndl);
  // snow sheen: grazing light on the fine crystals makes sunlit snow glow a little toward the sun
  if (id < 1.5) col += SUNC * pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 4.0) * 0.45 * sh * smoothstep(0.0, 0.3, ndl);
  if (iceG > 0.0) {   // glassy ice: sky reflection at grazing angles and a sharp sun glint
    float fr = 0.06 + 0.8 * pow(1.0 - max(dot(n, -rd), 0.0), 4.0);
    col += iceG * (fogColor(reflect(rd, n)) * fr * 0.8 + SUNC * pow(max(dot(reflect(rd, n), SUN), 0.0), 60.0) * 1.6 * sh);
  }
  if (id > 1.5 && id < 3.5) farT = smoothstep(105.0, 205.0, t);
  if (id < 1.5 && t < 38.0 && sh > 0.5) {
    float rnd = hash21(floor(p.xz * 22.0));
    float spark = step(0.997, rnd) * pow(max(dot(reflect(rd, n), SUN), 0.0), 6.0) * exp(-t * 0.07);
    col += SUNC * spark * 1.6;
  }
  if (id > 1.5) col += SUNC * pow(1.0 - max(dot(n, -rd), 0.0), 3.0) * max(dot(rd, SUN), 0.0) * 0.5 * sh;
  if (farT > 0.02) {
    // distant forest: dark spiky conifer masses with the low sun catching the sunward faces of their tops
